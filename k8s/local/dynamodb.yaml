apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-local
  template:
    metadata:
      labels:
        app: dynamodb-local
    spec:
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:2.5.2
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: dynamodb-local
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ddb-table-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli-init
          image: amazon/aws-cli:2.15.15
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "fakeKeyId"
            - name: AWS_SECRET_ACCESS_KEY
              value: "fakeSecretAccessKey"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for DynamoDB Local..."
              until curl -s http://dynamodb-local:8000; do sleep 1; done;
              echo "Creating FeatureFlags single table..."
              aws dynamodb create-table \
                --endpoint-url http://dynamodb-local:8000 \
                --table-name FeatureFlags \
                --attribute-definitions \
                  AttributeName=PK,AttributeType=S \
                  AttributeName=SK,AttributeType=S \
                --key-schema \
                  AttributeName=PK,KeyType=HASH \
                  AttributeName=SK,KeyType=RANGE \
                --billing-mode PAY_PER_REQUEST || true

              echo "Seeding initial demo flag..."
              aws dynamodb put-item \
                --endpoint-url http://dynamodb-local:8000 \
                --table-name FeatureFlags \
                --item '{
                  "PK": {"S": "TENANT#acme#ENV#local"},
                  "SK": {"S": "FLAG#ds-button-v2"},
                  "Key": {"S": "ds-button-v2"},
                  "Enabled": {"BOOL": true},
                  "DefaultValue": {"S": "v1"},
                  "Rollout": {"L": [
                    {"M": {"Variation": {"S": "v1"}, "BucketPercentage": {"N": "50"}}},
                    {"M": {"Variation": {"S": "v2"}, "BucketPercentage": {"N": "50"}}}
                  ]},
                  "UpdatedAt": {"N": "1757750400"}
                }' || true
              echo "Table created & seeded successfully."

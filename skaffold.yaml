apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: feature-flag-poc
build:
  artifacts:
    # 1. Go Flag Service (Optimized for file sync)
    - image: flag-service
      context: services/flag-service
      docker:
        dockerfile: Dockerfile.dev
      sync:
        infer:
          - '**/*.go'
          - 'config/*.yaml'

    # 2. Admin Control Console (Next.js / Vite SPA)
    - image: admin-portal
      context: apps/admin-portal
      docker:
        dockerfile: Dockerfile.dev
      sync:
        manual:
          - src: 'src/**/*.tsx'
            dest: '/app'
          - src: 'src/**/*.ts'
            dest: '/app'
          - src: 'src/**/*.css'
            dest: '/app'

    # 3. Client Demo Application
    - image: client-demo-app
      context: apps/client-demo-app
      docker:
        dockerfile: Dockerfile.dev
      sync:
        manual:
          - src: 'src/**/*'
            dest: '/app'

manifests:
  rawYaml:
    - k8s/local/network-policy.yaml
    - k8s/local/caddy.yaml
    - k8s/local/redis.yaml
    - k8s/local/dynamodb.yaml
    - k8s/local/flag-service.yaml
    - k8s/local/admin-portal.yaml
    - k8s/local/client-demo-app.yaml

portForward:
  - resourceType: Service
    resourceName: caddy
    port: 80
    localPort: 80
  - resourceType: Service
    resourceName: flag-service
    port: 8080
    localPort: 8080
  - resourceType: Service
    resourceName: redis-local
    port: 6379
    localPort: 6379
  - resourceType: Service
    resourceName: admin-portal
    port: 3000
    localPort: 3000
  - resourceType: Service
    resourceName: client-demo-app
    port: 3001
    localPort: 3001
  - resourceType: Service
    resourceName: dynamodb-local
    port: 8000
    localPort: 8000

profiles:
  - name: debug
    patches:
      - op: add
        path: /build/artifacts/0/docker/buildArgs
        value:
          ENABLE_DELVE: "true"
